[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fhirfence"
version = "2.1.0"
description = "Task-conditioned FHIR minimization against privacy leakage in clinical LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "networkx>=3.0", "pandas>=2.0", "numpy>=1.24", "PyYAML>=6.0",
]

# Install only the provider SDK you use, e.g.  pip install -e ".[gemini]"
[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
tokens = ["tiktoken>=0.5"]
audit = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
baseline = ["rank-bm25>=0.2.2"]

[tool.setuptools.packages.find]
where = ["src"]
