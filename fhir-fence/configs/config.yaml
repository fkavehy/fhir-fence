# FHIR-Fence — main configuration.
# Nothing in the codebase is hardcoded; every runtime value is read from here.

reproducibility:
  global_seed: 20260812
  canary_seed: 20260812

dataset:
  slug: mimic-iv-fhir-demo
  version: "2.1.0"
  # fhir/ subdirectory of the PhysioNet open-access release
  base_url: "https://physionet.org/files/mimic-iv-fhir-demo/2.1.0/fhir/"

cohort:
  n_final_patients: 40          # recipe §27: 30-50
  n_dev_patients: 8             # recipe §27: 5-10

# Scoring function:  Score(v,q) = alpha*R_policy + beta*R_graph - lambda*S(v)
# Retain v iff Score >= tau.  (gamma is the one-hop graph-proximity weight.)
scoring:
  alpha: 0.6
  beta: 0.6
  gamma: 0.7                    # R_graph weight for nodes one hop from a focal member
  lambda: 1.0
  tau: 0.75
  task_required_override: true  # authorized resource types get sensitivity 0

# Per-profile retention caps (keep most-recent N). Declared, not a property of the data.
profile_caps:
  MimicObservationChartevents: 25
  MimicObservationLabevents: 40
  MimicObservationED: 25
  MimicObservationVitalSignsED: 25
  MimicMedicationAdministration: 30
  MimicMedicationAdministrationICU: 20
  MimicMedicationRequest: 30
  MimicCondition: 30
  MimicConditionED: 20
  MimicProcedure: 20
  MimicProcedureED: 20
  MimicMedication: 40
  MimicEncounter: 10
  MimicEncounterED: 10
  MimicEncounterICU: 10
default_cap: 20

# Sensitivity classes and their penalty weights S(v).
sensitivity:
  classes:
    direct_identifier: 1.0
    quasi_identifier: 0.7
    sensitive_clinical: 0.6
    routine_clinical: 0.2
    task_required: 0.0
  profile_to_class:
    MimicPatient: quasi_identifier
    MimicEncounter: routine_clinical
    MimicEncounterED: routine_clinical
    MimicEncounterICU: routine_clinical
    MimicCondition: sensitive_clinical
    MimicConditionED: sensitive_clinical
    MimicProcedure: sensitive_clinical
    MimicProcedureED: sensitive_clinical
    MimicMedication: routine_clinical
    MimicMedicationRequest: routine_clinical
    MimicMedicationAdministration: routine_clinical
    MimicMedicationAdministrationICU: routine_clinical
    MimicObservationLabevents: routine_clinical
    MimicObservationChartevents: routine_clinical
    MimicObservationED: routine_clinical
    MimicObservationVitalSignsED: routine_clinical

# LLM agent. FHIR-Fence is provider-agnostic: the method only constructs the context,
# any model may consume it. Pick a provider and model here; the API key is read from the
# environment variable named below, never stored in this file.
#
#   provider:  gemini | openai | anthropic | echo   (see src/fhirfence/llm.py)
#   name:      the provider's own model identifier (examples are illustrative only)
#   api_key_env: the environment variable your key lives in (see .env.example)
#
# To run the offline demo with NO key and NO network, set provider: echo.
# For an OpenAI-compatible server (vLLM, Together, Groq, a local gateway), use
# provider: openai and add a `base_url:` line.
model:
  provider: gemini
  name: <your-model-id>         # e.g. a Gemini / OpenAI / Anthropic model you have access to
  temperature: 0.0
  max_output_tokens: 1024
  rpm_limit: 12                 # requests per minute; tune to your account's quota
  max_retries: 5
  api_key_env: GEMINI_API_KEY   # name of the environment variable holding the key
  # base_url:                   # only for provider: openai against a compatible endpoint

defenses:
  order: [B0, B1, B2, B3, B4]
  names:
    B0: Full Context
    B1: Full Context + Privacy Prompt
    B2: Direct Identifier Redaction
    B3: Task Policy Only
    B4: FHIR-Fence

# Resource profiles the three tasks can legitimately need. Everything else is counted
# in the audit but never parsed into graphs.
in_scope_profiles:
  - MimicPatient
  - MimicEncounter
  - MimicEncounterED
  - MimicEncounterICU
  - MimicCondition
  - MimicConditionED
  - MimicMedication
  - MimicMedicationRequest
  - MimicMedicationAdministration
  - MimicMedicationAdministrationICU
  - MimicObservationLabevents
  - MimicObservationChartevents
  - MimicObservationED
  - MimicObservationVitalSignsED
  - MimicProcedure
  - MimicProcedureED
